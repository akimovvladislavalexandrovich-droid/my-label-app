name: Build Electron App

# Запускать сборку при каждом пуше в ветку main (или master)
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    # Запускаем матрицу: одна сборка на Windows, вторая на Mac
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    # 1. Скачиваем ваш код на сервер GitHub
    - name: Check out Git repository
      uses: actions/checkout@v4

    # 2. Устанавливаем Node.js
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # 3. Устанавливаем зависимости из package.json
    - name: Install Dependencies
      run: npm install

    # 4. Собираем версию для Mac (если сервер на Mac)
    - name: Build Mac version
      if: matrix.os == 'macos-latest'
      run: npm run build:mac

    # 5. Собираем версию для Windows (если сервер на Windows)
    - name: Build Windows version
      if: matrix.os == 'windows-latest'
      run: npm run build:win

    # 6. Загружаем готовый .exe файл в результаты GitHub Actions
    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Quack-quack-Windows
        path: dist/*.exe

    # 7. Загружаем готовый .dmg файл в результаты GitHub Actions
    - name: Upload Mac Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Quack-quack-Mac
        path: dist/*.dmg