name: Build Electron App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Check out Git repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Dependencies
      run: npm install

    # Сборка для Windows
    - name: Build Windows version
      if: matrix.os == 'windows-latest'
      run: npm run build:win

    # Сборка для Mac (делаем Universal, чтобы работало везде)
    - name: Build Mac version
      if: matrix.os == 'macos-latest'
      run: npx electron-builder --mac --universal --publish never

    # Загрузка Windows (ищем любые .exe в папке dist)
    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Quack-quack-Windows
        path: dist/*.exe
        if-no-files-found: error

    # Загрузка Mac (ищем любые .dmg в папке dist)
    - name: Upload Mac Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: Quack-quack-Mac
        path: dist/*.dmg
        if-no-files-found: error